  <polygon points="133,36 136,26 140,36" fill="#0e0c16"/>
  <polygon points="140,36 144,26 147,36" fill="#0e0c16"/>
  <ellipse cx="137" cy="41" rx="2" ry="2" fill="#ff9060" opacity="0.85"/>
  <ellipse cx="144" cy="41" rx="2" ry="2" fill="#ff9060" opacity="0.85"/>
  <line x1="131" y1="43" x2="126" y2="41" stroke="#888" stroke-width="1"/>
